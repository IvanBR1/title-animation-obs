<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Títulos Animados - Visualizador para OBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="titles-styles.css">
</head>
<body>
    <div class="container" id="container">
        <!-- Fondo -->
        <div class="background" id="background"></div>
        
        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
        
        <!-- Logo -->
        <div class="logo-container" id="logo-container">
            <img class="logo-image" id="logo-image" src="" alt="Logo">
        </div>
        
        <!-- Barra inferior con título -->
        <div class="bottom-bar" id="bottom-bar">
            <div class="bar-content">
                <div class="title-text" id="title-text">Bienvenidos al Servicio</div>
                <div class="subtitle-text" id="subtitle-text">Domingo de Adoración</div>
            </div>
        </div>
    </div>

    <script>
        // Elementos del DOM
        const container = document.getElementById('container');
        const background = document.getElementById('background');
        const overlay = document.getElementById('overlay');
        const logoContainer = document.getElementById('logo-container');
        const logoImage = document.getElementById('logo-image');
        const bottomBar = document.getElementById('bottom-bar');
        const titleText = document.getElementById('title-text');
        const subtitleText = document.getElementById('subtitle-text');

        // Estado actual
        let currentConfig = {
            title: 'Bienvenidos al Servicio',
            subtitle: 'Domingo de Adoración',
            theme: 'church',
            backgroundImage: '',
            logoUrl: '',
            isVisible: false
        };

        // Aplicar tema
        function applyTheme(theme) {
            // Remover todas las clases de tema
            container.classList.remove(
                'theme-church',
                'theme-classic',
                'theme-modern',
                'theme-elegant',
                'theme-minimal'
            );
            
            // Aplicar nuevo tema
            container.classList.add(`theme-${theme}`);
            
            // Actualizar estado
            currentConfig.theme = theme;
            
            // Forzar reflow para reiniciar animaciones
            void container.offsetWidth;
        }

        // Configurar fondo
        function setBackground(imageUrl) {
            if (imageUrl) {
                background.style.backgroundImage = `url('${imageUrl}')`;
                background.classList.add('active');
                currentConfig.backgroundImage = imageUrl;
            } else {
                background.style.backgroundImage = '';
                background.classList.remove('active');
                currentConfig.backgroundImage = '';
            }
            
            // Activar overlay
            overlay.classList.add('active');
        }

        // Configurar logo
        function setLogo(logoUrl) {
            if (logoUrl) {
                logoImage.src = logoUrl;
                logoImage.onload = () => {
                    logoContainer.classList.add('active');
                };
                currentConfig.logoUrl = logoUrl;
            } else {
                logoContainer.classList.remove('active');
                logoImage.src = '';
                currentConfig.logoUrl = '';
            }
        }

        // Actualizar contenido
        function updateContent(title, subtitle = '') {
            // Primero quitar clases activas para reiniciar animación
            titleText.classList.remove('active');
            subtitleText.classList.remove('active');
            
            // Actualizar texto
            titleText.textContent = title;
            subtitleText.textContent = subtitle || '';
            
            currentConfig.title = title;
            currentConfig.subtitle = subtitle;
            
            // Reactivar animaciones
            setTimeout(() => {
                titleText.classList.add('active');
                if (subtitle) {
                    subtitleText.classList.add('active');
                }
            }, 50);
        }

        // Mostrar título completo
        function showTitle() {
            // Mostrar elementos con secuencia
            background.classList.add('active');
            overlay.classList.add('active');
            bottomBar.classList.add('active');
            
            // Logo con delay
            setTimeout(() => {
                logoContainer.classList.add('active');
            }, 300);
            
            // Textos con delay
            setTimeout(() => {
                titleText.classList.add('active');
                subtitleText.classList.add('active');
            }, 600);
            
            currentConfig.isVisible = true;
        }

        // Ocultar título con animación
        function hideTitle() {
            // Ocultar en secuencia inversa
            titleText.classList.remove('active');
            subtitleText.classList.remove('active');
            
            setTimeout(() => {
                logoContainer.classList.remove('active');
                bottomBar.classList.remove('active');
            }, 300);
            
            setTimeout(() => {
                overlay.classList.remove('active');
                background.classList.remove('active');
            }, 600);
            
            currentConfig.isVisible = false;
        }

        // Transición suave entre temas
        function transitionToNewTheme(newTheme, newTitle, newSubtitle, newBackground, newLogo) {
            // Primero ocultar
            hideTitle();
            
            // Cambiar configuración
            setTimeout(() => {
                if (newTheme) applyTheme(newTheme);
                if (newBackground !== undefined) setBackground(newBackground);
                if (newLogo !== undefined) setLogo(newLogo);
                if (newTitle || newSubtitle) {
                    updateContent(newTitle || currentConfig.title, newSubtitle || currentConfig.subtitle);
                }
                
                // Mostrar nuevo diseño
                setTimeout(showTitle, 100);
            }, 700);
        }

        // Escuchar comandos
        function listenForCommands() {
            window.addEventListener('storage', function (e) {
                if (e.key === 'animatedTitleCommand') {
                    const command = JSON.parse(localStorage.getItem('animatedTitleCommand'));
                    processCommand(command);
                    localStorage.removeItem('animatedTitleCommand');
                }
            });

            // Comandos pendientes
            const pendingCommand = localStorage.getItem('animatedTitleCommand');
            if (pendingCommand) {
                const command = JSON.parse(pendingCommand);
                processCommand(command);
                localStorage.removeItem('animatedTitleCommand');
            }
        }

        // Procesar comando
        function processCommand(command) {
            switch (command.action) {
                case 'update':
                    // Transición suave para cambios
                    transitionToNewTheme(
                        command.theme,
                        command.title,
                        command.subtitle,
                        command.backgroundImage,
                        command.logoUrl
                    );
                    break;
                    
                case 'show':
                    showTitle();
                    break;
                    
                case 'hide':
                    hideTitle();
                    break;
                    
                case 'setTheme':
                    if (currentConfig.isVisible) {
                        transitionToNewTheme(command.theme);
                    } else {
                        applyTheme(command.theme);
                    }
                    break;
                    
                case 'setBackground':
                    setBackground(command.backgroundImage);
                    break;
                    
                case 'setLogo':
                    setLogo(command.logoUrl);
                    break;
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function () {
            // Aplicar configuración inicial
            applyTheme('church');
            updateContent('Bienvenidos al Servicio', 'Domingo de Adoración');
            
            // Iniciar escucha de comandos
            listenForCommands();
        });
    </script>
</body>
</html>
